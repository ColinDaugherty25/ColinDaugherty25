name: Update Letterboxd feed
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "MOVIE-LIST"
          feed_list: "https://letterboxd.com/colin_daugherty/rss/"
          max_post_count: 4
          template: "$title"
